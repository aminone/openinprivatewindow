<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1c1b22;
      --text-muted: #4a4a4f;
      --card-bg: #fafafa;
      --card-border: #e0e0e6;
      --feedback: #2e8b40;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b22;
        --text: #f9f9fb;
        --text-muted: #cbcbd1;
        --card-bg: #2b2a33;
        --card-border: #42414d;
        --feedback: #5ec26a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 24px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    h1 {
      font-size: 22px;
    }
    .setting {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin: 24px 0;
      padding: 16px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
    }
    .setting input[type="checkbox"] {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .setting-body h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    .setting-body p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95em;
    }
    #saved-indicator {
      font-size: 0.85em;
      color: var(--feedback);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1 id="options-heading"></h1>

  <label class="setting" for="close-original-tab">
    <input type="checkbox" id="close-original-tab">
    <span class="setting-body">
      <h2 id="close-tab-title"></h2>
      <p id="close-tab-body"></p>
    </span>
  </label>

  <label class="setting" for="clean-tracking-params">
    <input type="checkbox" id="clean-tracking-params">
    <span class="setting-body">
      <h2 id="clean-params-title"></h2>
      <p id="clean-params-body"></p>
    </span>
  </label>

  <div id="saved-indicator" aria-live="polite"></div>

  <script src="options.js"></script>
</body>
</html>
