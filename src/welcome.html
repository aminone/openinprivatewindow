<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1c1b22;
      --text-muted: #4a4a4f;
      --accent: #6200a4;
      --accent-contrast: #fff;
      --card-bg: #fafafa;
      --card-border: #e0e0e6;
      --code-bg: #eee;
      --note-bg: #f3e9fb;
      --feedback: #2e8b40;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b22;
        --text: #f9f9fb;
        --text-muted: #cbcbd1;
        --accent: #c893ff;
        --accent-contrast: #1c1b22;
        --card-bg: #2b2a33;
        --card-border: #42414d;
        --code-bg: #38373f;
        --note-bg: #382e4d;
        --feedback: #5ec26a;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 24px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    h1 {
      font-size: 22px;
    }
    .step {
      display: flex;
      gap: 16px;
      margin: 24px 0;
      padding: 16px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card-bg);
    }
    .step-number {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-contrast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .step-body h2 {
      margin: 0 0 4px 0;
      font-size: 16px;
    }
    .step-body p {
      margin: 0;
      color: var(--text-muted);
    }
    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .note {
      margin-top: 32px;
      padding: 12px 16px;
      border-left: 4px solid var(--accent);
      background: var(--note-bg);
      font-size: 0.95em;
    }
    #copy-btn {
      margin-left: 8px;
      padding: 4px 12px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--bg);
      color: var(--accent);
      cursor: pointer;
      font-size: 0.9em;
    }
    #copy-btn:hover {
      background: var(--note-bg);
    }
    #copy-feedback {
      margin-left: 8px;
      font-size: 0.85em;
      color: var(--feedback);
    }
    .about {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }
    .about h2 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    .about p {
      margin: 0 0 8px 0;
      color: var(--text-muted);
    }
    .link-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .link-list li {
      margin: 4px 0;
    }
    .link-list a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95em;
    }
    .link-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1 id="welcome-heading"></h1>
  <p id="welcome-intro"></p>

  <div class="step">
    <div class="step-number">1</div>
    <div class="step-body">
      <h2 id="step1-title"></h2>
      <p>
        <span id="step1-goto"></span> <code id="addons-url">about:addons</code>
        <button id="copy-btn" type="button"></button>
        <span id="copy-feedback" aria-live="polite"></span>
      </p>
      <p id="step1-instructions"></p>
    </div>
  </div>

  <div class="step">
    <div class="step-number">2</div>
    <div class="step-body">
      <h2 id="step2-title"></h2>
      <p id="step2-body"></p>
    </div>
  </div>

  <div class="step">
    <div class="step-number">3</div>
    <div class="step-body">
      <h2 id="step3-title"></h2>
      <p id="step3-body"></p>
    </div>
  </div>

  <div class="note" id="welcome-note"></div>

  <section class="about">
    <h2 id="about-heading"></h2>
    <p id="about-body"></p>
  </section>

  <section class="about">
    <h2 id="author-heading"></h2>
    <p id="author-body"></p>
    <ul class="link-list">
      <li><a id="author-repo-link" href="https://github.com/aminone/openinprivatewindow" target="_blank" rel="noopener"></a></li>
      <li><a id="author-email-link" href="mailto:amin@mahmudian.ir"></a></li>
      <li><a id="author-site-link" href="https://mahmudian.ir" target="_blank" rel="noopener"></a></li>
    </ul>
  </section>

  <section class="about">
    <h2 id="credits-heading"></h2>
    <p id="credits-body"></p>
    <ul class="link-list">
      <li><a id="credits-link" href="https://github.com/mpchadwick/tracking-query-params-registry" target="_blank" rel="noopener"></a></li>
    </ul>
  </section>

  <script src="welcome.js"></script>
</body>
</html>
